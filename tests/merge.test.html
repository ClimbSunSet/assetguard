<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>AssetGuard 테스트</title>
<style>
  body { font: 14px/1.5 system-ui, sans-serif; margin: 24px; background: #fff; color: #111; }
  .pass { color: #0a7d32; } .fail { color: #c62828; font-weight: 600; }
  pre { background: #f4f4f4; padding: 8px; white-space: pre-wrap; }
</style>
</head>
<body>
<h1>AssetGuard 병합 엔진 테스트</h1>
<p id="summary">실행 중…</p>
<ul id="out"></ul>
<script src="../web/merge.js"></script>
<script src="../web/formats.js"></script>
<script>
(function () {
  var M = window.AssetGuardMerge, F = window.AssetGuardFormats;
  var results = [];
  function test(name, fn) {
    try { fn(); results.push({ name: name, ok: true }); }
    catch (e) { results.push({ name: name, ok: false, err: e && e.stack || String(e) }); }
  }
  function eq(a, b, msg) {
    if (!M.same(a, b)) throw new Error((msg || '값이 다름') + '\n  기대: ' + JSON.stringify(b) + '\n  실제: ' + JSON.stringify(a));
  }
  function T(rows) { // rows: { Name: {col: v} }
    var cols = [];
    var list = Object.keys(rows).map(function (n) {
      Object.keys(rows[n]).forEach(function (c) { if (cols.indexOf(c) < 0) cols.push(c); });
      return { name: n, cells: rows[n] };
    });
    return { columns: cols, rows: list };
  }
  function cell(res, row, col) {
    var r = res.rows.filter(function (x) { return x.name === row; })[0];
    return r && r.cells[col];
  }
  function names(table) { return table.rows.map(function (r) { return r.name; }); }

  // ----- 사업계획서 표의 4가지 규칙 -----
  test('내가 바꾼 칸은 내 값 자동 채택', function () {
    var r = M.merge3(T({ A: { HP: 10 } }), T({ A: { HP: 12 } }), T({ A: { HP: 10 } }));
    eq(cell(r, 'A', 'HP'), { value: 12, source: 'ours' }); eq(r.conflicts.length, 0);
  });
  test('상대가 바꾼 칸은 상대 값 자동 채택', function () {
    var r = M.merge3(T({ A: { HP: 10 } }), T({ A: { HP: 10 } }), T({ A: { HP: 15 } }));
    eq(cell(r, 'A', 'HP'), { value: 15, source: 'theirs' }); eq(r.conflicts.length, 0);
  });
  test('상대가 추가한 행은 자동 채택', function () {
    var r = M.merge3(T({ A: { HP: 10 } }), T({ A: { HP: 10 } }), T({ A: { HP: 10 }, B: { HP: 5 } }));
    var row = r.rows.filter(function (x) { return x.name === 'B'; })[0];
    eq(row.status, 'added-theirs'); eq(cell(r, 'B', 'HP'), { value: 5, source: 'theirs' });
  });
  test('양쪽이 같은 칸을 다르게 바꾸면 진짜 충돌', function () {
    var r = M.merge3(T({ A: { HP: 10 } }), T({ A: { HP: 12 } }), T({ A: { HP: 15 } }));
    eq(r.conflicts.length, 1); eq(r.conflicts[0].kind, 'cell');
    eq([r.conflicts[0].base, r.conflicts[0].ours, r.conflicts[0].theirs], [10, 12, 15]);
    eq(cell(r, 'A', 'HP').source, 'conflict');
  });

  // ----- 추가 규칙 -----
  test('같은 행의 다른 칸을 각자 바꾸면 둘 다 반영', function () {
    var r = M.merge3(T({ A: { HP: 10, Speed: 1 } }), T({ A: { HP: 12, Speed: 1 } }), T({ A: { HP: 10, Speed: 3 } }));
    eq(r.conflicts.length, 0);
    var out = M.applyResolutions(r, {});
    eq(out.rows[0].cells, { HP: 12, Speed: 3 });
  });
  test('양쪽이 같은 값으로 바꾸면 충돌 아님 (source=both)', function () {
    var r = M.merge3(T({ A: { HP: 10 } }), T({ A: { HP: 20 } }), T({ A: { HP: 20 } }));
    eq(cell(r, 'A', 'HP'), { value: 20, source: 'both' });
  });
  test('양쪽이 서로 다른 행을 추가하면 둘 다 들어감 (실제 사례 대부분)', function () {
    var base = T({ A: { HP: 1 } });
    var r = M.merge3(base, T({ A: { HP: 1 }, Mine: { HP: 2 } }), T({ A: { HP: 1 }, Theirs: { HP: 3 } }));
    eq(r.conflicts.length, 0);
    eq(names(M.applyResolutions(r, {})), ['A', 'Mine', 'Theirs']);
  });
  test('상대 추가 행은 상대 파일에서의 위치 근처에 들어감', function () {
    var r = M.merge3(T({ A: {x:1}, C: {x:1} }), T({ A: {x:1}, C: {x:1} }), T({ A: {x:1}, B: {x:2}, C: {x:1} }));
    eq(names(M.applyResolutions(r, {})), ['A', 'B', 'C']);
  });
  test('같은 이름 행을 양쪽이 다르게 추가하면 칸 충돌', function () {
    var r = M.merge3(T({}), T({ N: { HP: 1, S: 9 } }), T({ N: { HP: 2, S: 9 } }));
    eq(r.conflicts.length, 1); eq(r.conflicts[0].column, 'HP'); eq(r.conflicts[0].base, undefined);
  });
  test('한쪽이 지우고 상대는 안 건드렸으면 삭제', function () {
    var base = T({ A: { HP: 1 }, B: { HP: 2 } });
    var r = M.merge3(base, T({ A: { HP: 1 } }), base);
    eq(r.conflicts.length, 0); eq(names(M.applyResolutions(r, {})), ['A']);
    eq(r.rows.filter(function (x) { return x.name === 'B'; })[0].deletedBy, 'ours');
  });
  test('한쪽이 지우고 상대가 고쳤으면 행 충돌', function () {
    var r = M.merge3(T({ A: { HP: 1 }, B: { HP: 2 } }), T({ A: { HP: 1 } }), T({ A: { HP: 1 }, B: { HP: 5 } }));
    eq(r.conflicts.length, 1); eq(r.conflicts[0].kind, 'row');
    eq(names(M.applyResolutions(r, { c0: 'ours' })), ['A']);
    var kept = M.applyResolutions(r, { c0: 'theirs' });
    eq(kept.rows[1], { name: 'B', cells: { HP: 5 } });
  });
  test('구조체·배열 값도 내용으로 비교 (키 순서 무관)', function () {
    var r = M.merge3(T({ A: { V: { X: 1, Y: 2 } } }), T({ A: { V: { Y: 2, X: 1 } } }), T({ A: { V: { X: 1, Y: 3 } } }));
    eq(r.conflicts.length, 0); eq(cell(r, 'A', 'V'), { value: { X: 1, Y: 3 }, source: 'theirs' });
  });
  test('상대가 새 열을 추가하면 열과 값이 들어감', function () {
    var r = M.merge3(T({ A: { HP: 1 } }), T({ A: { HP: 2 } }), T({ A: { HP: 1, Armor: 7 } }));
    var out = M.applyResolutions(r, {});
    eq(out.columns, ['HP', 'Armor']); eq(out.rows[0].cells, { HP: 2, Armor: 7 });
  });
  test('미해결 충돌이 있으면 저장 거부', function () {
    var r = M.merge3(T({ A: { HP: 10 } }), T({ A: { HP: 12 } }), T({ A: { HP: 15 } }));
    var threw = false; try { M.applyResolutions(r, {}); } catch (e) { threw = true; }
    eq(threw, true);
  });
  test('직접 입력 값으로 충돌 해결', function () {
    var r = M.merge3(T({ A: { HP: 10 } }), T({ A: { HP: 12 } }), T({ A: { HP: 15 } }));
    eq(M.applyResolutions(r, { c0: { custom: 14 } }).rows[0].cells.HP, 14);
  });
  test('같은 입력이면 항상 같은 결과 (결정적)', function () {
    var b = T({ A: { HP: 1 }, B: { HP: 2 } }), o = T({ A: { HP: 3 }, C: { HP: 4 } }), t = T({ B: { HP: 2 }, A: { HP: 1 }, D: { HP: 5 } });
    eq(JSON.stringify(M.merge3(b, o, t)), JSON.stringify(M.merge3(b, o, t)));
  });

  // ----- 포맷 -----
  test('UE JSON 왕복 (탭 들여쓰기, CRLF 유지)', function () {
    var src = '[\r\n\t{\r\n\t\t"Name": "Row_1",\r\n\t\t"HP": 10\r\n\t}\r\n]\r\n';
    var t = F.parse('x.json', src);
    eq(t.columns, ['HP']); eq(F.write(t, t.style), src);
  });
  test('UE CSV 왕복 (값 따옴표 유지)', function () {
    var src = '---,HP,Desc\r\nRow_1,"10","He said ""hi"", ok"\r\nRow_2,"5",""\r\n';
    var t = F.parse('x.csv', src);
    eq(t.rows[0].cells.Desc, 'He said "hi", ok');
    eq(F.write(t, t.style), src);
  });
  test('파일이 한쪽에 없으면 null', function () { eq(F.parse('x.json', null), null); });
  test('파일이 새로 생긴 경우(공통 원본 없음)도 병합', function () {
    var r = M.merge3(null, T({ A: { HP: 1 } }), T({ B: { HP: 2 } }));
    eq(names(M.applyResolutions(r, {})), ['A', 'B']);
  });

  // ----- 리뷰 반영: 조용히 틀리게 합치지 않기 -----
  function throws(fn, pattern) {
    var msg = null; try { fn(); } catch (e) { msg = e.message; }
    if (msg === null) throw new Error('예외가 나야 하는데 안 남');
    if (pattern && !pattern.test(msg)) throw new Error('예외 메시지가 다름: ' + msg);
  }
  function TC(cols, rows) { var t = T(rows); t.columns = cols; return t; }

  test('중복 행 이름이면 병합 거부 (대소문자 무시)', function () {
    var dup = { columns: ['HP'], rows: [{ name: 'Sedan', cells: { HP: 1 } }, { name: 'sedan', cells: { HP: 2 } }] };
    throws(function () { M.merge3(null, dup, T({ A: { HP: 1 } })); }, /중복/);
    throws(function () { F.parse('x.csv', '---,HP\nSedan,1\nSedan,2\n'); }, /중복/);
    throws(function () { F.parse('x.json', '[{"Name":"A","HP":1},{"Name":"a","HP":2}]'); }, /중복/);
  });
  test('대소문자만 다른 행은 같은 행으로 합치고 경고', function () {
    var r = M.merge3(T({ A: { HP: 1 } }), T({ A: { HP: 1 }, Slime: { HP: 5 } }), T({ A: { HP: 1 }, slime: { HP: 5 } }));
    var out = M.applyResolutions(r, {});
    eq(names(out), ['A', 'Slime']); eq(r.conflicts.length, 0); eq(r.warnings.length, 1);
  });
  test('2^53 넘는 정수와 2.000000 표기를 그대로 보존', function () {
    var src = '[\n\t{\n\t\t"Name": "A",\n\t\t"Id": 9007199254740993,\n\t\t"F": 2.000000\n\t}\n]\n';
    var t = F.parse('x.json', src); eq(F.write(t, t.style), src);
  });
  test('큰 정수의 마지막 자리 변경도 변경으로 감지', function () {
    var b = F.parse('x.json', '[{"Name":"A","Id":9007199254740992}]');
    var t = F.parse('x.json', '[{"Name":"A","Id":9007199254740993}]');
    var r = M.merge3(b, b, t);
    eq(M.canon(cell(r, 'A', 'Id').value), M.canon(new M.Num('9007199254740993'))); eq(cell(r, 'A', 'Id').source, 'theirs');
  });
  test('2.0과 2는 같은 값으로 비교', function () {
    var r = M.merge3(T({ A: { F: new M.Num('2.0') } }), T({ A: { F: new M.Num('2') } }), T({ A: { F: new M.Num('2.000') } }));
    eq(r.stats.autoCells, 0); eq(r.conflicts.length, 0);
  });
  test('한쪽이 지운 열은 다른 쪽이 안 건드렸으면 빠지고 경고', function () {
    var base = TC(['HP', 'X'], { A: { HP: 1, X: 9 } });
    var r = M.merge3(base, TC(['HP'], { A: { HP: 2 } }), base);
    eq(r.columns, ['HP']); eq(r.warnings.length, 1);
  });
  test('한쪽이 지운 열을 다른 쪽이 고쳤으면 병합 거부', function () {
    var base = TC(['HP', 'X'], { A: { HP: 1, X: 9 } });
    throws(function () { M.merge3(base, TC(['HP'], { A: { HP: 1 } }), TC(['HP', 'X'], { A: { HP: 1, X: 10 } })); }, /열/);
  });
  test('한쪽이 지운 열에 다른 쪽이 새 행 값을 넣었으면 병합 거부', function () {
    var base = TC(['HP', 'X'], { A: { HP: 1, X: 9 } });
    throws(function () { M.merge3(base, TC(['HP'], { A: { HP: 1 } }), TC(['HP', 'X'], { A: { HP: 1, X: 9 }, B: { HP: 2, X: 3 } })); }, /열/);
  });
  test('결과 행이 0개여도 CSV 헤더 유지', function () {
    var base = F.parse('x.csv', '---,HP,Speed\nA,"1","2"\n');
    var empty = F.parse('x.csv', '---,HP,Speed\n');
    var r = M.merge3(base, empty, base);
    eq(F.write(M.applyResolutions(r, {}), base.style), '---,HP,Speed\n');
  });
  test('내가 새 열을 만들었는데 상대가 새 행을 추가하면 경고', function () {
    var base = TC(['HP'], { A: { HP: 1 } });
    var r = M.merge3(base, TC(['HP', 'Armor'], { A: { HP: 1, Armor: 5 } }), TC(['HP'], { A: { HP: 1 }, B: { HP: 2 } }));
    eq(r.warnings.length, 1); eq(r.conflicts.length, 0);
  });
  test('한쪽 버전이 없으면(파일 삭제) 병합 거부', function () {
    throws(function () { M.merge3(T({ A: { HP: 1 } }), null, T({ A: { HP: 2 } })); });
  });
  test('CSV: 중복 열·헤더 밖 값·닫히지 않은 따옴표는 거부', function () {
    throws(function () { F.parse('x.csv', '---,HP,hp\nA,1,2\n'); }, /열 이름/);
    throws(function () { F.parse('x.csv', '---,HP\nA,1,99\n'); }, /헤더보다/);
    throws(function () { F.parse('x.csv', '---,HP\nA,"1\n'); }, /따옴표/);
  });
  test('CSV: 엑셀식 빈 꼬리 열은 무시', function () {
    var t = F.parse('x.csv', '---,HP,,\nA,1,,\n');
    eq(t.columns, ['HP']); eq(t.rows[0].cells.HP, '1');
  });
  test('NUL이 섞인 텍스트(UTF-16 등)는 거부', function () {
    throws(function () { F.parse('x.csv', '-\u0000-\u0000'); }, /인코딩/);
  });
  test('LF 파일의 따옴표 안 CRLF가 파일 전체 줄바꿈을 바꾸지 않음', function () {
    var t = F.parse('x.csv', '---,Desc\nA,"line1\r\nline2"\n');
    eq(t.style.eol, '\n');
  });
  test('constructor 같은 이름의 열도 정상 처리', function () {
    var r = M.merge3(TC(['constructor'], { A: { constructor: 1 } }), TC(['constructor'], { A: { constructor: 2 } }), TC(['constructor'], { A: { constructor: 1 } }));
    eq(cell(r, 'A', 'constructor'), { value: 2, source: 'ours' });
  });
  test('앞 행을 내가 지운 자리에 상대가 추가한 행은 맨 위로 가지 않음', function () {
    var base = T({ A: { x: 1 }, B: { x: 1 }, C: { x: 1 } });
    var r = M.merge3(base, T({ A: { x: 1 }, C: { x: 1 } }), T({ A: { x: 1 }, B: { x: 1 }, N: { x: 2 }, C: { x: 1 } }));
    eq(names(M.applyResolutions(r, {})), ['A', 'N', 'C']);
  });

  var failed = results.filter(function (r) { return !r.ok; });
  document.getElementById('summary').innerHTML = failed.length
    ? '<span class="fail">' + failed.length + '개 실패</span> / ' + results.length + '개'
    : '<span class="pass">모두 통과</span> (' + results.length + '개)';
  document.getElementById('out').innerHTML = results.map(function (r) {
    return '<li class="' + (r.ok ? 'pass' : 'fail') + '">' + (r.ok ? '✔ ' : '✘ ') + r.name +
      (r.ok ? '' : '<pre>' + r.err.replace(/</g, '&lt;') + '</pre>') + '</li>';
  }).join('');
  window.__testResults = { total: results.length, failed: failed.map(function (f) { return f.name + ': ' + f.err; }) };
})();
</script>
</body>
</html>
